[package]
name = "vips"
version = "0.2.0"
authors = ["elbaro <elbaro@github>", "houseme <housemecn@gmail.com>"]
edition = "2024"
resolver = "3"
description = "Rust bindings for libvips: fast, low-memory image processing with a safe, ergonomic API."
keywords = ["vips", "image", "libvips"]
documentation = "https://docs.rs/vips"
repository = "https://github.com/houseme/vips-rs"
categories = ["multimedia::images"]
license = "MIT"

# Local builds use the sibling checkout. Cargo packages retain the version
# requirement for crates.io; publish vips-sys before publishing this crate.
[dependencies]
vips-sys = { version = "0.3.0", path = "../vips-sys", features = ["helpers"] }

[features]
default = []
v8_18 = ["vips-sys/v8_18"]

[dev-dependencies]
trybuild = "1.0"

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
